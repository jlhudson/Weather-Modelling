# Weather on a server, run by Portainer: compose path compose.production.yaml, with .env.production
# (The-Hub-Database/env/make-env.sh) loaded as the stack's variables, which Portainer saves as stack.env.
# The image is the one CI built. What was left out on purpose, and why you might add it:
# The-Hub-Database/docs/recommended.md.
name: weather

services:
  db:
    image: postgis/postgis:18-3.6
    container_name: weather-db
    env_file: stack.env
    volumes:
      - weather-db:/var/lib/postgresql
    # Every 2 s while it starts, so the app isn't kept waiting, then once a minute: each check is a shell,
    # pg_isready and a new Postgres backend, and every 5 s that was nearly all the database's CPU.
    healthcheck:
      test: pg_isready -U weather -d weather
      interval: 60s
      start_period: 2m
      start_interval: 2s
      retries: 3
    restart: unless-stopped

  app:
    image: ghcr.io/jlhudson/weather-app:main
    pull_policy: always
    container_name: weather-app
    # default reaches this stack's database; apps is the network the Hub, Operations and Weather share on
    # their server (docker/server/bootstrap.sh in The-Hub-Database makes it), so they call each other by name.
    networks: [default, apps]
    env_file: stack.env
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/weather
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: prodrigestivill/postgres-backup-local:18
    container_name: weather-backup
    env_file: stack.env
    environment:
      POSTGRES_HOST: db
      SCHEDULE: "@daily"
    volumes:
      - weather-backups:/backups
    depends_on:
      - db
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: weather-tunnel
    command: tunnel run
    env_file: stack.env
    restart: unless-stopped

networks:
  apps:
    name: apps
    external: true

volumes:
  weather-db: { name: weather-db }
  weather-backups: { name: weather-backups }
