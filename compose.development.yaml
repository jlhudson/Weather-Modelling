# Weather on your PC: ▶ beside `services:` in IntelliJ, or `docker compose -f compose.development.yaml up -d`.
# Every run rebuilds the app from this folder; the database keeps its data. Settings: .env.development,
# written by The-Hub-Database/env/make-env.sh. What was left out on purpose, and why you might add it:
# The-Hub-Database/docs/recommended.md.
name: weather

services:
  db:
    image: postgis/postgis:18-3.6
    container_name: weather-db
    env_file: .env.development
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - weather-db:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U weather -d weather
      interval: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    pull_policy: build
    container_name: weather-app
    env_file: .env.development
    environment:
      SPRING_PROFILES_ACTIVE: development
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/weather
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: prodrigestivill/postgres-backup-local:18
    container_name: weather-backup
    env_file: .env.development
    environment:
      POSTGRES_HOST: db
      SCHEDULE: "@daily"
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: weather-tunnel
    command: tunnel run
    env_file: .env.development
    restart: unless-stopped

volumes:
  weather-db: { name: weather-db }
