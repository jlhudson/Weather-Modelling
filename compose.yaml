# Gully: one stack, one machine (The-Hub-Database/docs/28-deployment.md, D-255).
#
# Three containers: Postgres, the application, and the Cloudflare connector that publishes it. Nothing
# here belongs to a particular machine: what differs from one to the next is an environment variable,
# read from .env beside this file or from the stack's variables in Portainer. The same file runs on a
# development machine (`docker compose up -d`) and on a VPS as a Portainer stack deployed from this
# repository's `main`.
#
# The service and container names are `weather-*` and the database volume `weather-pgdata`, so The
# Hub's HUB_WEATHER_URL keeps working.
#
# No bind mounts of repository files. A development machine builds the images from the checkout
# (PULL_POLICY unset); a server sets PULL_POLICY=always and pulls the ones CI tested and pushed to
# ghcr.io (IMAGE_TAG, main by default; a commit to roll back). The edge is a profile: COMPOSE_PROFILES=edge starts the connector.
services:
  db:
    image: postgis/postgis:18-3.6
    container_name: weather-db
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weather}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Loopback only. 5435 on the host: 5432 is the Hub stack's Postgres, 5433 IncidentWatch's and
      # 5434 Operations', so all four run on one machine.
      - "127.0.0.1:${WEATHER_DB_PORT:-5435}:5432"
    volumes:
      # The PostgreSQL 18 image keeps its data directory under /var/lib/postgresql.
      - weather-pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weather} -d ${POSTGRES_DB:-weather}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    image: ghcr.io/jlhudson/weather-app:${IMAGE_TAG:-main}
    pull_policy: ${PULL_POLICY:-build}
    container_name: weather-app
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: UTC
      # prod on a server: refuses to start on a blank or default secret, and logs as JSON.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-weather}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-weather}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      WEATHER_CONSOLE_CODE: ${WEATHER_CONSOLE_CODE:?set WEATHER_CONSOLE_CODE (8 digits) in .env}
      WEATHER_CORS_ORIGINS: ${WEATHER_CORS_ORIGINS:-}
      WEATHER_CONTACT: ${WEATHER_CONTACT:-https://github.com/jlhudson/Weather-Modelling}
      GOOGLE_WEATHER_KEY: ${GOOGLE_WEATHER_KEY:-}
      CARTO_API_KEY: ${CARTO_API_KEY:-}
      # Structured JSON logs in the container; the console log pattern is for the IDE.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:-ecs}
    ports:
      # Loopback only: the tunnel carries the public traffic, and a VPS should accept nothing else.
      - "127.0.0.1:${WEATHER_PORT:-8082}:8082"
    # The JVM takes 75% of this for its heap (Dockerfile).
    mem_limit: ${WEATHER_MEM_LIMIT:-1g}
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://localhost:8082/actuator/health/readiness" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # The nightly backup (docker/backup, as Operations'): pg_dump at BACKUP_AT, kept BACKUP_KEEP_DAYS on
  # the weather-backups volume, copied off the box when BACKUP_RCLONE_REMOTE names an rclone remote
  # (Cloudflare R2 or S3 through the RCLONE_CONFIG_R2_* lines), and restored into a scratch database
  # on the first of each month to prove it restores. `docker logs weather-backup` says how each run went.
  backup:
    build: docker/backup
    image: ghcr.io/jlhudson/weather-backup:${IMAGE_TAG:-main}
    pull_policy: ${PULL_POLICY:-build}
    container_name: weather-backup
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: UTC
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-weather}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATABASE: ${POSTGRES_DB:-weather}
      BACKUP_NAME: weather
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_RUN_NOW: ${BACKUP_RUN_NOW:-1}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      RCLONE_CONFIG_R2_TYPE: ${RCLONE_CONFIG_R2_TYPE:-}
      RCLONE_CONFIG_R2_PROVIDER: ${RCLONE_CONFIG_R2_PROVIDER:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ENDPOINT: ${RCLONE_CONFIG_R2_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACL: private
    volumes:
      - weather-backups:/backups
    restart: unless-stopped

  # The edge: the connector dials out to Cloudflare over QUIC and forwards to the application on this
  # network. Which hostname reaches it is set on the tunnel in the Cloudflare dashboard: one published
  # application route, type HTTP, URL app:8082, path empty (.env.example).
  cloudflared:
    profiles: [ edge ]
    image: cloudflare/cloudflared:latest
    container_name: weather-cloudflared
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: UTC
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel run
    restart: unless-stopped

volumes:
  weather-pgdata:
  weather-backups:
