# Gully: one stack, standalone.
#
# The application, and - under the `owndb` profile - its own PostGIS and nightly backup. The stack owns
# its volumes and deploys from this repository alone. The same file runs on a development machine
# (`docker compose up -d`, which merges compose.override.yaml to build from this checkout) and on a
# server as a Portainer stack from `main`, where it pulls the image CI pushed to ghcr.io and Watchtower
# replaces it when CI pushes a new one.
#
# The database. COMPOSE_PROFILES=owndb (as .env.development.example sets) starts a PostGIS for this stack
# alone. On a server that runs the shared `postgis` stack (The-Hub-Database/docker/postgis), drop the
# profile and set WEATHER_DB_HOST=postgis: the application then uses the database that stack made for
# it, and the backup is that stack's too.
#
# Being asked. The app joins the `apps` network, an external network created once per machine
# (`docker network create apps`), which every stack's app joins too. On it this service answers at
# http://weather-app:8082, which is what the Hub's HUB_WEATHER_URL defaults to; from the other server
# the Hub uses http://vps-1:8082 over Tailscale. Gully asks nothing of the other applications. Public
# traffic comes in through the server's edge stack, never through anything here.
#
# No `build:` here (Portainer builds every one it finds, on the server; the build lives in
# compose.override.yaml) and no bind mounts of repository files (Portainer's clone is invisible to
# the Docker engine). Named volumes only, named outright.
name: weather

services:
  db:
    profiles: [ owndb ]
    image: postgis/postgis:18-3.6
    container_name: weather-db
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weather}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Loopback only. 5435 on the host: 5432 is the Hub's Postgres, 5433 IncidentWatch's, 5434 Operations'
      # and 5436 WaterBuddy's, so every stack runs on one machine.
      - "127.0.0.1:${WEATHER_DB_PORT:-5435}:5432"
    volumes:
      # The PostgreSQL 18 image keeps its data directory under /var/lib/postgresql.
      - weather-pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weather} -d ${POSTGRES_DB:-weather}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: ghcr.io/jlhudson/weather-app:${IMAGE_TAG:-main}
    pull_policy: always
    container_name: weather-app
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    labels:
      # Watchtower replaces this container when CI pushes a newer image.
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      db:
        condition: service_healthy
        # Not started under the shared-database layout: the profile is off and this is ignored.
        required: false
    environment:
      TZ: UTC
      # production on a server: refuses to start on a blank or default secret, and logs as JSON.
      # development on your own machine: the readable log pattern.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${WEATHER_DB_HOST:-db}:5432/${POSTGRES_DB:-weather}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-weather}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      WEATHER_CONSOLE_CODE: ${WEATHER_CONSOLE_CODE:?set WEATHER_CONSOLE_CODE (8 digits) in .env}
      WEATHER_CORS_ORIGINS: ${WEATHER_CORS_ORIGINS:-}
      WEATHER_CONTACT: ${WEATHER_CONTACT:-https://github.com/jlhudson/Weather-Modelling}
      # The key this service accepts from the Hub, pre-shared: the same value is the Hub's
      # HUB_WEATHER_API_KEY. Upserted as consumer `hub` on start; console-issued keys still work.
      WEATHER_KEY_HUB: ${WEATHER_KEY_HUB:-}
      GOOGLE_WEATHER_KEY: ${GOOGLE_WEATHER_KEY:-}
      CARTO_API_KEY: ${CARTO_API_KEY:-}
      # Structured JSON logs in the container; the console log pattern is for the IDE.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:-ecs}
    ports:
      # 127.0.0.1 on a development machine; on a server, its Tailscale address, so the other server and
      # Uptime Kuma reach the application over WireGuard and nothing else can.
      - "${WEATHER_BIND:-127.0.0.1}:${WEATHER_PORT:-8082}:8082"
    networks:
      - default
      - apps
    # The JVM takes 75% of this for its heap (Dockerfile).
    mem_limit: ${WEATHER_MEM_LIMIT:-1g}
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://localhost:8082/actuator/health/readiness" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # The nightly backup of this stack's own database (docker/backup): pg_dump at BACKUP_AT, kept
  # BACKUP_KEEP_DAYS on the weather-backups volume, copied off the box when BACKUP_RCLONE_REMOTE names
  # an rclone remote (Cloudflare R2 or S3 through the RCLONE_CONFIG_R2_* lines), and restored into a
  # scratch database on the first of each month to prove it restores. `docker logs weather-backup`.
  backup:
    profiles: [ owndb ]
    image: ghcr.io/jlhudson/weather-backup:${IMAGE_TAG:-main}
    pull_policy: always
    container_name: weather-backup
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: UTC
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-weather}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATABASE: ${POSTGRES_DB:-weather}
      BACKUP_NAME: weather
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_RUN_NOW: ${BACKUP_RUN_NOW:-1}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      RCLONE_CONFIG_R2_TYPE: ${RCLONE_CONFIG_R2_TYPE:-}
      RCLONE_CONFIG_R2_PROVIDER: ${RCLONE_CONFIG_R2_PROVIDER:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ENDPOINT: ${RCLONE_CONFIG_R2_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACL: private
    volumes:
      - weather-backups:/backups
    restart: unless-stopped

networks:
  # This stack's own: the database and the backup reach the app here, and nothing outside the stack
  # reaches the database.
  default:
  # Shared by every stack on this machine, created once by hand: `docker network create apps`.
  apps:
    external: true

# Named outright, so the data is the same whatever the stack is called.
volumes:
  weather-pgdata: { name: weather-pgdata }
  weather-backups: { name: weather-backups }
