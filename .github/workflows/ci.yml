# Build and test on main only. Feature work is verified locally with Claude Code and IntelliJ; this
# workflow proves that what landed on main still builds on a clean machine, and publishes the image the
# server runs. Every application's ci.yml is this file with its own name, test database and browser checks
# (The-Hub-Database/docs/applications.md).
name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# A newer push to main makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # No services: the end-to-end test starts its own Postgres with Testcontainers.

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Turns a red cross into a table of which tests failed and the assertion that broke.
      # Stdlib Python, no third-party action: nothing to pin, nothing to update.
      - name: Summarise test results
        if: always()
        run: python3 .github/scripts/test_summary.py '**/target/surefire-reports/TEST-*.xml'

      # Only when something broke: the raw reports, for the failure that needs more than a stack trace.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
          if-no-files-found: ignore

  # On main, once the tests pass: the image to GitHub's registry, tagged main and the commit, so a server
  # pulls what was tested instead of building it, and the last ten commits' images are there to roll back
  # to. Nothing is deployed from here: Watchtower on the server replaces the container when a newer image
  # appears, and Portainer redeploys the stack when main changes its compose file
  # (The-Hub-Database/docs/production.md).
  image:
    name: Image weather-app
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # One manifest per image: an attestation adds untagged child manifests, and the pruning step
          # below deleted them, leaving :main pointing at a manifest the registry no longer had.
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/weather-app:main
            ghcr.io/${{ github.repository_owner }}/weather-app:${{ github.sha }}
          cache-from: type=gha,scope=weather-app
          cache-to: type=gha,mode=max,scope=weather-app

      # A private package counts against the account's storage: the last ten images are enough to roll back to.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: weather-app
          package-type: container
          min-versions-to-keep: 10
