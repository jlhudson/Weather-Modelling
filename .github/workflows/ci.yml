# Build and test on main only. Feature work is verified locally with Claude Code and IntelliJ;
# this workflow exists to prove that what landed on main still builds on a clean machine.
name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B -ntp verify

      # Turns a red cross into a table of which tests failed and the assertion that broke.
      # Stdlib Python, no third-party action: nothing to pin, nothing to update.
      - name: Summarise test results
        if: always()
        run: python3 .github/scripts/test_summary.py 'target/surefire-reports/TEST-*.xml'

      # Only when something broke: the raw reports, for the failure that needs more than a stack trace.
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: 'target/surefire-reports/'
          retention-days: 7
