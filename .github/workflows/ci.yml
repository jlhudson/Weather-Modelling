# Build and test on main only. Feature work is verified locally with Claude Code and IntelliJ;
# the end-to-end test starts a throwaway Postgres with Testcontainers, which the runner has Docker for.
# this workflow exists to prove that what landed on main still builds on a clean machine.
name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B -ntp verify

      # Turns a red cross into a table of which tests failed and the assertion that broke.
      # Stdlib Python, no third-party action: nothing to pin, nothing to update.
      - name: Summarise test results
        if: always()
        run: python3 .github/scripts/test_summary.py 'target/surefire-reports/TEST-*.xml'

      # Only when something broke: the raw reports, for the failure that needs more than a stack trace.
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: 'target/surefire-reports/'
          retention-days: 7

  # On main, once the tests pass: the images to GitHub's registry, tagged main and the commit, so a
  # server pulls what was tested instead of building it, and a rollback is a tag (IMAGE_TAG in .env).
  image:
    name: Image ${{ matrix.name }}
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: weather-app, context: . }
          - { name: weather-backup, context: docker/backup }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:main
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # A private package counts against the account's storage: the last ten images are enough to roll back to.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 10

  # The deployment told to pull: Portainer's stack webhook, a repository secret. Unset, nothing is deployed.
  redeploy:
    name: Redeploy
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the Portainer webhook
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "PORTAINER_WEBHOOK_URL is not set: the images are pushed, nothing is redeployed"; exit 0; fi
          curl -fsS -X POST "$WEBHOOK"
