<!DOCTYPE html>
<html lang="en" th:fragment="page(title, content)" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="${title} + ' · Gully'">Gully</title>
    <!-- Before the stylesheet, so the page is never painted in the wrong theme first. -->
    <script>
        (function () {
            var s = null;
            try { s = localStorage.getItem('gully.theme'); } catch (e) {}
            var c = s || 'dark';
            var dark = c === 'dark' || (c === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme-choice', c);
        })();
    </script>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.5/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/leaflet/1.9.4/dist/leaflet.css}">
    <link rel="stylesheet" th:href="@{/css/console.css}">
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : 'X-CSRF-TOKEN'">
    <meta name="carto-key" th:content="${cartoKey != null} ? ${cartoKey} : ''">
</head>
<body>
<nav class="g-nav">
    <a class="brand" th:href="@{/console/map}">Gully</a>
    <a class="nav-link" th:classappend="${title == 'Map'} ? 'active'" th:href="@{/console/map}">Map</a>
    <a class="nav-link" th:classappend="${title == 'Hexagons'} ? 'active'" th:href="@{/console/hexagons}">Hexagons</a>
    <a class="nav-link" th:classappend="${title == 'Upstreams'} ? 'active'" th:href="@{/console/upstreams}">Upstreams</a>
    <a class="nav-link" th:classappend="${title == 'Curing'} ? 'active'" th:href="@{/console/curing}">Curing</a>
    <a class="nav-link" th:classappend="${title == 'Diagnostics'} ? 'active'" th:href="@{/console/diagnostics}">Diagnostics</a>
    <a class="nav-link" th:classappend="${title == 'API keys'} ? 'active'" th:href="@{/console/api-keys}">API keys</a>
    <div class="right">
        <span th:text="${operator}">operator</span>
        <select class="form-select form-select-sm w-auto" id="theme" title="Theme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="auto">System</option>
        </select>
        <form class="d-inline" method="post" th:action="@{/logout}">
            <button class="btn btn-sm btn-outline-secondary py-0">Log out</button>
        </form>
    </div>
</nav>
<main th:insert="${content}"></main>
<script th:src="@{/webjars/bootstrap/5.3.5/dist/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/leaflet/1.9.4/dist/leaflet.js}"></script>
<script th:src="@{/js/console.js}"></script>
</body>
</html>
