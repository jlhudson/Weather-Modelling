<!DOCTYPE html>
<html data-bs-theme="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Log in · Gully</title>
    <script>
        (function () {
            var s = null;
            try { s = localStorage.getItem('gully.theme'); } catch (e) {}
            var c = s || 'dark';
            var dark = c === 'dark' || (c === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        })();
    </script>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.5/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/console.css}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
<form class="border rounded p-3" method="post" style="width: 18rem;" th:action="@{/login}">
    <h1 class="mb-2">Gully</h1>
    <div class="alert alert-danger py-1" th:if="${param.error}">Wrong code, or locked after too many attempts.</div>
    <div class="alert alert-secondary py-1" th:if="${param.out}">Logged out.</div>
    <input name="username" type="hidden" value="operator">
    <input autocomplete="one-time-code" autofocus class="form-control text-center mono mb-2" inputmode="numeric" maxlength="8"
           name="code" pattern="\d{8}" placeholder="8-digit code" required type="password">
    <button class="btn btn-primary w-100 btn-sm">Enter</button>
</form>
</body>
</html>
