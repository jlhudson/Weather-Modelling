# One configuration, one environment, and as close to empty as it can be. Every setting this service
# has carries its default in GullyProperties (or DiagnosticsProperties) and is
# printed once at startup; what is here is Spring's own wiring plus the handful of values that differ
# between one machine and the next, each read from an environment variable. Secrets never appear here.
spring:
  application:
    name: gully
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/weather}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:weather}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:change-me}}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  # Flyway owns the schema (db/migration).
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: true
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 30s
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: always

server:
  port: 8082
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json, application/geo+json, application/problem+json, text/html, text/css, application/javascript
    min-response-size: 1024


management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      # A dead database shows as a restarting container, which is what we want (docs/06 item 11).
      group:
        readiness:
          include: readinessState, db
        liveness:
          include: livenessState
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%-20.20t] %-30.30logger{0} : %m%n%wEx"
  # Structured JSON in production: set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (compose.yaml does).
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:}
  level:
    au.gully: INFO
    org.springframework: WARN
    org.springframework.boot.tomcat.TomcatWebServer: INFO
    org.apache: WARN
    com.zaxxer.hikari: WARN
    org.flywaydb: WARN

# The few that are a property of the machine rather than of the system.
gully:
  contact: ${WEATHER_CONTACT:https://github.com/jlhudson/Weather-Modelling}
  console:
    code: ${WEATHER_CONSOLE_CODE:12345678}
  api:
    cors-origins: ${WEATHER_CORS_ORIGINS:}
